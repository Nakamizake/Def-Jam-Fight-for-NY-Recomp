; Def Jam: Fight for NY (GNWE69) -- the game's textures that show a GameCube button, and how the
; port draws its own icon in their place. The runtime (RecompButtonIcons) redraws them whenever
; the player switches between a pad and the keyboard, or changes a binding, so every icon shows
; what actually performs that action on the device in use.
;
; Section: the texture's Dolphin name (tex1_<w>x<h>_<hash>[_<tlut hash>]_<format>).
; Coordinates are in the original texture's pixels; the icon is drawn at four times that size.
;   button  = the pad control it shows, as <group>/<control> from the GameCube pad's
;             configuration (Buttons/A, Triggers/L, ...) or a whole stick (Main Stick, C-Stick)
;   glyph   = x y w h: the box the glyph is fitted into, centred, keeping its proportions
;   outline = #rrggbb n: a border n pixels wide that follows the glyph's shape
;   rects   = #rrggbb x y w h, ...: solid boxes drawn under the glyph (the lines some icons
;             carry to join a frame, the tabs on the trophy pages)
;
; Nothing here comes from the disc but the names: the art is the port's own (glyphs/).

