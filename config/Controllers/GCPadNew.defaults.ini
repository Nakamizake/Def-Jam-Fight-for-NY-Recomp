# Default controller profile: the PlayStation 2 release's layout on any SDL gamepad.
#
# scripts/run.ps1 copies this to userdata/Config/GCPadNew.ini only when that file does not
# exist, so rebinding in the in-game menu (Esc) sticks. Delete that file to get this back.
# With the menu's Layout on Auto (the default), the layout matching the connected pad
# (Layouts/<PlayStation|Xbox|GameCube>.ini) replaces these bindings at every start.
#
# SDL names face buttons by position (Xbox letters): `Button A` is the bottom one (Cross),
# `Button B` the right one (Circle), `Button X` the left one (Square), `Button Y` the top
# one (Triangle). The device below is only a starting point: when it is not connected the
# runtime rebinds the pad to whichever gamepad is.
#
#   Action (in game)          PS2           GameCube
#   Punch                     Triangle      Y
#   Kick                      Square        B
#   Grapple / throw / pick up Cross         A
#   Run                       Circle        X
#   Block                     R1            R
#   Strong attack modifier    L1            L
#   Target (multi-fighter)    R2 / L2       Z
#   Taunt / Blazin'           right stick   C-stick
#
# The keyboard plays too (bound by full name, so it works whatever the pad is):
#   W A S D move, I punch, J kick, K grapple, L run, E block, Q modifier, Tab target,
#   arrows the C-stick, Enter start.

[GCPad1]
Device = SDL/0/DualSense Wireless Controller
Buttons/A = `Button A` | `DInput/0/Keyboard Mouse:K`
Buttons/B = `Button X` | `DInput/0/Keyboard Mouse:J`
Buttons/X = `Button B` | `DInput/0/Keyboard Mouse:L`
Buttons/Y = `Button Y` | `DInput/0/Keyboard Mouse:I`
Buttons/Z = `Trigger R` | `Trigger L` | `DInput/0/Keyboard Mouse:TAB`
Buttons/Start = Start | `DInput/0/Keyboard Mouse:RETURN`
Main Stick/Up = `Left Y+` | `DInput/0/Keyboard Mouse:W`
Main Stick/Down = `Left Y-` | `DInput/0/Keyboard Mouse:S`
Main Stick/Left = `Left X-` | `DInput/0/Keyboard Mouse:A`
Main Stick/Right = `Left X+` | `DInput/0/Keyboard Mouse:D`
Main Stick/Calibration = 100.00
C-Stick/Up = `Right Y+` | `DInput/0/Keyboard Mouse:UP`
C-Stick/Down = `Right Y-` | `DInput/0/Keyboard Mouse:DOWN`
C-Stick/Left = `Right X-` | `DInput/0/Keyboard Mouse:LEFT`
C-Stick/Right = `Right X+` | `DInput/0/Keyboard Mouse:RIGHT`
C-Stick/Calibration = 100.00
# The game reads L and R as buttons; the analog half is driven fully by the shoulder too.
Triggers/L = `Shoulder L` | `DInput/0/Keyboard Mouse:Q`
Triggers/R = `Shoulder R` | `DInput/0/Keyboard Mouse:E`
Triggers/L-Analog = `Shoulder L` | `DInput/0/Keyboard Mouse:Q`
Triggers/R-Analog = `Shoulder R` | `DInput/0/Keyboard Mouse:E`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Rumble/Motor = `Motor L` | `Motor R`
