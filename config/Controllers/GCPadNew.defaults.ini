# Default controller profile: the PlayStation 2 release's layout on any SDL gamepad.
#
# scripts/run.ps1 copies this to userdata/Config/GCPadNew.ini only when that file does not
# exist, so rebinding in the in-game menu (Esc) sticks. Delete that file to get this back.
# With the menu's Layout on Auto (the default), the layout matching the connected pad
# (Layouts/<PlayStation|Xbox|GameCube>.ini) replaces these bindings at every start.
#
# SDL names face buttons by position (Xbox letters): `Button A` is the bottom one (Cross),
# `Button B` the right one (Circle), `Button X` the left one (Square), `Button Y` the top
# one (Triangle). The device below is only a starting point: when it is not connected the
# runtime rebinds the pad to whichever gamepad is.
#
#   Action (in game)          PS2           GameCube
#   Punch                     Triangle      Y
#   Kick                      Square        B
#   Grapple / throw / pick up Cross         A
#   Run                       Circle        X
#   Block                     R1            R
#   Strong attack modifier    L1            L
#   Target (multi-fighter)    R2 / L2       Z
#   Taunt / Blazin'           right stick   C-stick

[GCPad1]
Device = SDL/0/DualSense Wireless Controller
Buttons/A = `Button A`
Buttons/B = `Button X`
Buttons/X = `Button B`
Buttons/Y = `Button Y`
Buttons/Z = `Trigger R` | `Trigger L`
Buttons/Start = Start
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
Main Stick/Calibration = 100.00
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
C-Stick/Calibration = 100.00
# The game reads L and R as buttons; the analog half is driven fully by the shoulder too.
Triggers/L = `Shoulder L`
Triggers/R = `Shoulder R`
Triggers/L-Analog = `Shoulder L`
Triggers/R-Analog = `Shoulder R`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Rumble/Motor = `Motor L` | `Motor R`
