# Control layout for RecompPadLayout (the CONTROLS tab's Layout row): the PlayStation 2 release.
# scripts/GameBuild.psm1 copies it to userdata/Config/Profiles/GCPad/ every time the game is set
# up, so edits there are replaced; save your own layout under another name.
#
# Face buttons are bound by position (SDL names them like an Xbox pad: `Button A` is the bottom
# one), and sit where they did on every release: punch top, kick left, grapple bottom, run right.
#
#   Block R1, strong attack modifier L1, target L2 / R2.
[Profile]
Buttons/A = `Button A`
Buttons/B = `Button X`
Buttons/X = `Button B`
Buttons/Y = `Button Y`
Buttons/Z = `Trigger R` | `Trigger L`
Buttons/Start = Start
Main Stick/Up = `Left Y+`
Main Stick/Down = `Left Y-`
Main Stick/Left = `Left X-`
Main Stick/Right = `Left X+`
Main Stick/Calibration = 100.00
C-Stick/Up = `Right Y+`
C-Stick/Down = `Right Y-`
C-Stick/Left = `Right X-`
C-Stick/Right = `Right X+`
C-Stick/Calibration = 100.00
# The game reads L and R as buttons; the analog half is driven fully by the shoulder too.
Triggers/L = `Shoulder L`
Triggers/R = `Shoulder R`
Triggers/L-Analog = `Shoulder L`
Triggers/R-Analog = `Shoulder R`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Rumble/Motor = `Motor L` | `Motor R`
