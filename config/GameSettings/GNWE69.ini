# Def Jam: Fight for NY (USA) - per-game runtime settings for this port.
# Copied to userdata/GameSettings/ by scripts/run.ps1 on every launch, where Dolphin
# layers it over the bundled defaults. Edit this file, not the copy.

[Core]
# OS idle loop (OSReschedule spin on the run queue):
#   80276D20  lwz    r0, -28256(r13)
#   80276D24  cmplwi r0, 0
#   80276D28  beq    80276D20
# With this set the runtime fast-forwards to the next event instead of spinning
# natively; it was the hottest code in the profile (~1/3 of guest time).
# 2150067488 = 0x80276D20.
StaticRecompIdlePC = 2150067488

# Run the GPU emulation on its own thread ("dual core"); without it one host thread
# did everything.
CPUThread = True

# Keep fights smooth: lock the game's 120 Hz pad alarm to the video fields.
# The game queues one logic step (1/60 s) every second firing of a periodic OSAlarm at
# 120 Hz (struct 0x8040BED0; the SDK dispatcher 0x8024CD94 wakes the pad thread
# 0x800EC374, whose divider adds 0.5 per firing to a float at *0x802EF698 + 7584 and
# queues a step when it reaches 1). Its main loop 0x80004CD0 runs the queued steps, then
# draws one frame per 59.94 Hz field. 60 steps a second against 59.94 frames drift past
# each other every ~17 s, and whenever a step arrived right around the loop's "is a step
# due?" check (which moves by several ms with how long the frame waited on a full GX FIFO),
# the steps came 1, 2, 0 per frame for seconds: 60 fps presented, judder like 30-40 fps.
# Locked, the alarm fires twice per field at fixed points and the divider is reset every
# field, so the step always comes from the firing 2 ms after a field ends. Measured over
# 30-90 s runs (2v2 fight, 2v2 special, 1v1), doubled steps went from 6.5-7.5% of fields
# to 0 (10 ms works as well; the pattern repeats every ~8 ms). The game runs 0.1% slower,
# as nothing catches up the drift.
# 2151726800 = 0x8040BED0, 2150561432 = 0x802EF698.
ViLockedAlarm = 2151726800
ViLockedAlarmPerField = 2
ViLockedAlarmPhaseUs = 2000
ViLockedAlarmDividerPointer = 2150561432
ViLockedAlarmDividerOffset = 7584
ViLockedAlarmDividerValue = 0.5
# The count of queued steps (0x800EC144 runs one while obj+6088 is not 0). Locked, one step
# is queued per field, so the count changes between field ends only when a frame ran no step
# or two: the judder. When it does in several fields of half a second, the phase moves 1 ms
# earlier, so the lock holds at any overclock and in any arena, and finds its way out again
# when a pause or a loaded state left it somewhere that judders (at 10 ms in a 1v1 fight a
# third of the frames ran two steps; 2, 6 and 13 ms were clean).
ViLockedAlarmQueueOffset = 6088

[Video_Settings]
# Menu and dialog text is invisible with fast depth: the game draws its text at depths the
# fast (non-exact) depth path rounds behind the panel underneath. Dolphin issue 10018.
FastDepthCalc = False

[Video_Hacks]
# EA's VP6 movies show dotted vertical lines with the GPU's own texture sampling; manual
# sampling reproduces the GameCube's texel addressing exactly. Dolphin wiki: Manual Texture
# Sampling, issue 7193.
FastTextureSampling = False

# Keep 60 fps through camera sequences (Blazin' moves, crowd throws, replays). The game
# halves its frame rate for them, presumably for the GameCube's sake: on entering a
# sequence 0x8007EA44 calls 0x8000E190, which sets the fields per frame at 0x802F45D8 to 2
# (0x8000E1B8 sets it back to 1 on leaving). Its post-retrace callback 0x80112C28 only flips
# a finished frame after that many fields. Nothing else writes 0x802F45D8, so pinning it to
# 1 only lifts the cap. The same callback records the measured frame time (mftb delta at
# 0x802F45E4), so sequences should keep their normal speed at 60. Applied on every field.
[OnFrame]
$Keep 60 fps in camera sequences
0x802F45D8:dword:0x00000001

[OnFrame_Enabled]
$Keep 60 fps in camera sequences
