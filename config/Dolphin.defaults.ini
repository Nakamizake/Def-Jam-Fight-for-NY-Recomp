# First-run defaults for settings the player can change in the in-game menu (Esc).
#
# scripts/run.ps1 copies a key into userdata/Config/Dolphin.ini only when that file does
# not have it yet, so a value picked in the menu always wins afterwards. Settings that
# must not be changed by the player belong in config/GameSettings/<id>.ini instead (that
# layer overrides the menu).

[Core]
# Emulated Gekko clock (menu: System > CPU Overclock). This game drops to 30 or 20 fps
# whenever a frame's work misses its deadline in EMULATED time, even with the host at full
# speed. At 2x a 1v1 fight went from min 21.8 / avg 45.0 fps to min 59.5 / avg 59.9 at
# speed 1.0. Higher steps (300%, 400%) help 2v2 more and cost more host CPU; if the game
# starts running in slow motion, step back down.
OverclockEnable = True
Overclock = 2.0
